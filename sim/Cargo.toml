[package]
name = "ur-sim"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# A desktop simulator for the firmware's UI: runs `src/ui.rs` and the
# hardware-free modules it needs (included via `#[path]`) on the host, with
# stand-ins for the hardware. Not part of the firmware workspace: build and
# run it from this directory. See README.md here.
[workspace]

# Everything is in the library, for other front ends to share; the binary
# is the command line.
[lib]
path = "src/lib.rs"

[[bin]]
name = "ur-sim"
path = "src/main.rs"

[features]
default = ["window"]
# The interactive window; without it (e.g. in CI), scripts still run and
# write screenshots.
window = ["dep:minifb"]
# The firmware's watch faces and themes (see its Cargo.toml), for drawing
# them here (`living-tokyo.txt`). The tests, and their approved
# screenshots, are of the defaults: run `cargo test` without these.
face-living-tokyo = []
theme-tokyo-night = []
living-tokyo = ["face-living-tokyo", "theme-tokyo-night"]

[lints.rust]
# The firmware's own features, which the modules included from it check
# (`compare`'s hooks in `ui_loop`): never on here.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("compare"))'] }

[dependencies]
aes = "0.8.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
critical-section = { version = "1", features = ["std"] }
defmt = "1.2.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-time-driver = { version = "0.2", features = ["tick-hz-32_768"] }
embedded-storage-async = "0.4.1"
gif = { version = "0.14.2", default-features = false, features = ["std", "raii_no_panic"] }
heapless = "0.9.3"
libm = "0.2.16"
minifb = { version = "0.29.0", optional = true }
png = "0.18.1"
sequential-storage = { version = "8.0.2", features = ["defmt"] }

# A model of Gadgetbridge, for `src/gadgetbridge.rs` to play the phone
# with. Not in the browser's build, which has no fuzzer.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gbmock = { path = "../gbmock" }
