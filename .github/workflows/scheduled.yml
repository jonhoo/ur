# Rolling jobs, run daily as well as on pushes and PRs, since the build can
# break without any change here: a new nightly, or new dependency releases.
# See check.yml for how the concurrency cancellation and triggers work.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 7 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: rolling
jobs:
  # Early warning of compiler changes that will reach stable: the firmware
  # leans on recent language features (let chains, naked functions).
  nightly:
    runs-on: ubuntu-latest
    name: nightly / firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: nightly
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - name: build and package
        run: scripts/release.sh 0.0.0 dist
  # Whether the newest semver-compatible dependencies (embassy and friends
  # move quickly) still build and pass, ahead of dependabot proposing them.
  update:
    runs-on: ubuntu-latest
    name: beta / updated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install beta
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: beta
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - name: cargo update
        run: |
          cargo update
          for crate in host-tests/*/; do
            (cd "$crate" && cargo update)
          done
      - name: build and package
        # (Not `RUSTFLAGS: -D deprecated`, as rust-ci-conf does: RUSTFLAGS
        # replaces .cargo/config.toml's rustflags, which hold the linker
        # scripts.)
        run: scripts/release.sh 0.0.0 dist
      - name: host tests
        run: |
          for crate in host-tests/*/; do
            (cd "$crate" && cargo test --locked --release)
          done
