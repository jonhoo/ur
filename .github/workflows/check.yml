# Runs whenever a PR is opened or updated, or a commit is pushed to main:
# - fmt: rustfmt, for the firmware, each host-test crate, and the simulator
# - clippy: lints, for the firmware as released (both variants; see
#   scripts/release.sh) and as compared with the simulator (`compare`,
#   which covers `debug-input` too), with the pinned toolchain and on
#   beta, and with every theme (`themes-all`), and for the simulator
#   (sim/), with and without its window, and with every theme
# - scripts: shellcheck, and that the Python scripts at least parse
#
# Most of jonhoo/rust-ci-conf's library checks (semver, minimal versions,
# MSRV, feature powersets, docs.rs) don't apply: this is firmware for one
# target, built from Cargo.lock, with nothing downstream depending on it.
#
# The toolchain is the one rust-toolchain.toml pins, for releases to be
# reproducible; `rustup toolchain install` (with no arguments) installs it,
# so the pin lives in that one file. Beta, for early warning of new lints
# and breakage, is installed alongside and selected with `cargo +beta`,
# which overrides the pin.
permissions:
  contents: read
# Restricting the push trigger to main means a PR from a branch of this repo
# only gets built once.
on:
  push:
    branches: [main]
  pull_request:
# New pushes to a PR cancel its in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: check
jobs:
  fmt:
    runs-on: ubuntu-latest
    name: fmt / ${{ matrix.crate }}
    strategy:
      fail-fast: false
      matrix:
        crate: [".", host-tests/alarm, host-tests/aranet, host-tests/arrival, host-tests/backoff, host-tests/battery, host-tests/brightness, host-tests/bthome, host-tests/calendar, host-tests/buttons, host-tests/day, host-tests/decimal, host-tests/dfu, host-tests/font, host-tests/gb, host-tests/gb_buckets, host-tests/gesture, host-tests/glance, host-tests/heart_schedule, host-tests/link, host-tests/live, host-tests/mcuboot, host-tests/minute_ring, host-tests/nav, host-tests/on_time, host-tests/packet_pool, host-tests/ppg, host-tests/qr, host-tests/route, host-tests/rtt_ring, host-tests/sleep, host-tests/step_counter, host-tests/snapshot, host-tests/temperature, host-tests/theme, host-tests/wake, gbmock, sim]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: cargo fmt --check
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --check
  clippy:
    runs-on: ubuntu-latest
    name: ${{ matrix.toolchain }} / clippy / ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [pinned, beta]
        variant: [ur, ur-logging, compare, flash-stress, themes-all]
        include:
          - variant: ur
            features: ""
          - variant: ur-logging
            features: field-log
          # Not released: for checking the simulator against a dev kit.
          - variant: compare
            features: compare
          # Not released: a dev kit's flash stress test.
          - variant: flash-stress
            features: flash-stress
          # Every theme together. Each theme's own package is built alone
          # (see scripts/release.sh), which features.yml lints.
          - variant: themes-all
            features: themes-all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install beta
        if: matrix.toolchain == 'beta'
        run: rustup toolchain install beta --profile minimal --target thumbv7em-none-eabihf --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          key: ${{ matrix.toolchain }}
      # The target comes from .cargo/config.toml. Release profile, as that's
      # what ships (and some lints depend on the profile's cfgs).
      - name: cargo clippy
        run: >-
          cargo ${{ matrix.toolchain == 'beta' && '+beta' || '' }}
          clippy --locked --release --features "${{ matrix.features }}" -- -D warnings
  sim-clippy:
    runs-on: ubuntu-latest
    name: clippy / sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          workspaces: sim
      # With the window too: on Linux it only loads X11 or Wayland when it
      # opens, so it builds without either installed.
      - name: cargo clippy
        working-directory: sim
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
  scripts:
    runs-on: ubuntu-latest
    name: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      # shellcheck comes with the runner image.
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: python syntax
        run: python3 -m py_compile scripts/*.py docs/*.py
