# The slow checks that are still cheap, on every release tag (rc's
# included) and on demand: what test.yml doesn't run on every PR, in
# minutes. A failure on an rc is the signal to fix it before the final
# release; this doesn't hold up release.yml, which a tag starts at the
# same time.
# - miri: the tests of the host-test crates with `unsafe` code under Miri,
#   which catches the undefined behaviour (out-of-bounds or misaligned
#   pointers, aliasing, data races) that a normal run passes over
# - coverage: line and branch coverage of the host tests and the
#   simulator's tests, merged (scripts/coverage.sh), to read: in the run's
#   summary, and as HTML. No number fails it
#
# No job in CI may run for hours, release tags included, and until
# November 2026 three here did (on v0.12.0's tag: every Kani proof, 2h06;
# every Bolero harness fuzzed for four minutes, 3h01; the simulator's
# fuzz targets for half an hour each, 1h02), failing on three tags in a
# row without anyone noticing, as nothing waits for this workflow. They
# are gone from CI:
# - the Kani proofs a change affects run on that change (kani.yml);
# - all of it runs on the maintainer's computer before a release is
#   tagged: scripts/release-gate.sh (see CONTRIBUTING.md's "Local release
#   gate").
# test.yml still gives every Bolero harness a second (`cargo test`) and
# runs the simulator's fuzz seeds, on every PR.
#
# Nightly: Miri and branch coverage need it, so it is pinned here (not in
# rust-toolchain.toml, which is the release compiler), as test.yml pins
# it; scripts/release-gate.sh reads the pin from here, for its fuzzers.
# TODO: Dependabot doesn't update this pin; move it when it breaks, or a
# new Rust edition needs it.
#
# See CONTRIBUTING.md for running each of these locally.
permissions:
  contents: read
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NIGHTLY: nightly-2026-11-06
name: verify
jobs:
  miri:
    runs-on: ubuntu-latest
    name: miri
    # About a minute on a desktop (in November 2026; packet_pool 48 s).
    timeout-minutes: 30
    env:
      # Undefined behaviour needs `unsafe`, so these are the crates with
      # any: packet_pool, the firmware's own (src/packet_pool.rs: buffers
      # handed out by raw pointer); gesture's test clock (a `static mut`,
      # which the test runner's threads share) and route's test strings
      # (`from_utf8_unchecked`). In the others, which are safe Rust, Miri
      # finds nothing a normal run doesn't, at up to a thousand times the
      # time (battery's charging simulation alone runs past half an hour).
      # TODO: a crate that gains `unsafe` (in its own code, or a module
      # of src/ it includes) belongs here.
      MIRI_CRATES: packet_pool gesture route
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install nightly, with Miri
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
      # Bolero's harnesses read their corpus from disk, which Miri's
      # isolation forbids, so they're skipped.
      - name: cargo miri test, the crates with unsafe code
        run: |
          failed=()
          read -ra crates <<<"$MIRI_CRATES"
          for crate in "${crates[@]}"; do
            dir=host-tests/$crate
            echo "::group::$crate"
            (cd "$dir" && timeout 30m cargo "+$NIGHTLY" miri test --locked -- --skip fuzz::) || failed+=("$crate")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Miri failed in: ${failed[*]}"
            exit 1
          fi
  # Line and branch coverage (scripts/coverage.sh): the firmware's modules
  # through the host tests and the simulator, and the simulator through
  # its tests, merged into one report. Not a check (no number fails it;
  # its tests failing does, as they do in test.yml): a release's look at
  # what no test reaches, as the run's summary (each file, least covered
  # first, and the functions never run) and as HTML, line by line (the
  # `coverage` artifact). Self-contained, like the job above.
  coverage:
    runs-on: ubuntu-latest
    name: coverage
    # Four minutes on a desktop, building with 8 jobs (in November 2026),
    # most of it building.
    timeout-minutes: 60
    env:
      CARGO_LLVM_COV_VERSION: 0.9.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      # The simulator's tests compare its screenshots with the approved
      # ones, in Git LFS: from the cache test.yml fills, as it does.
      - name: list LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort >lfs-ids
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag=v6.1.0
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('lfs-ids') }}
          restore-keys: lfs-
      - name: fetch LFS objects
        run: git lfs pull
      # Nightly, as branch coverage is unstable; with llvm-tools, whose
      # llvm-cov reads what that compiler's instrumentation wrote.
      - name: Install nightly, with llvm-tools
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component llvm-tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag=v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Install cargo-llvm-cov
        run: command -v cargo-llvm-cov >/dev/null || cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
      - name: scripts/coverage.sh
        run: scripts/coverage.sh coverage
      # Even when a test failed: the script still writes the report, of
      # what the tests ran.
      - name: summary
        if: ${{ !cancelled() && hashFiles('coverage/summary.md') != '' }}
        run: cat coverage/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        if: ${{ !cancelled() && hashFiles('coverage/summary.md') != '' }}
        with:
          name: coverage
          path: |
            coverage/html/
            coverage/summary.md
          if-no-files-found: error
