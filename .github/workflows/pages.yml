# Publishes the project's site to GitHub Pages
# (https://jonhoo.github.io/ur/): a landing page made from README.md, and
# the simulator's web page (sim/web/) under sim/, so the watch can be
# tried in a browser, as of the latest commit on main. sim/web/site.sh
# builds both, as it does locally.
#
# Needs Pages switched on, with GitHub Actions as its source (Settings,
# Pages, "Build and deployment"); until then, this fails at "configure".
#
# test.yml's sim-web job checks the simulator's build on every PR (and that
# its screenshots match the command line's); this only builds and deploys.
permissions:
  contents: read
on:
  push:
    branches: [main]
    # The simulator includes the firmware's own UI modules, and its
    # version from Cargo.toml; the landing page is the README, and the
    # images it shows.
    paths:
      - "src/**"
      - "sim/**"
      - "Cargo.toml"
      - "README.md"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
# One deployment at a time, and never cut short: a newer push queues
# behind the one deploying.
concurrency:
  group: pages
  cancel-in-progress: false
name: pages
jobs:
  # That the simulator builds with every theme, as the page has them.
  features:
    uses: ./.github/workflows/features.yml
    with:
      firmware: false
  build:
    needs: features
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          workspaces: sim
          key: web
      - name: configure
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # tag=v6.0.0
      # The checkout has the README's images as Git LFS pointers (no
      # `lfs: true`): site.sh fetches only the ones the page shows, under
      # 100 KB, rather than every image in the repository. That's
      # little enough per deploy that a cache of them, as test.yml keeps
      # for the approved screenshots, isn't worth its steps. The token is
      # for GitHub's markdown API, which renders the README.
      - name: web/site.sh
        working-directory: sim
        run: web/site.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # tag=v5.0.0
        with:
          path: sim/target/site/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # tag=v5.0.1
