# The main CI workflow, on all pushes to main and all PRs:
# - host-tests: the firmware's hardware-free modules (signal processing,
#   sleep, alarms, glance detection, heart rate scheduling, navigation
#   between screens, turn-by-turn directions, number parsing, telling
#   touches apart, the button grid's gestures, BTHome advertisements and
#   QR code, what a touch does with the screen off, Gadgetbridge's
#   messages and link, colours that must differ in every colour scheme), each built into a
#   host crate under host-tests/ and tested on the computer, with the
#   pinned toolchain and on beta
# - sim: the simulator's tests (sim/), which check its screenshots of the
#   UI against the approved ones (every theme's own too), and those
#   screenshots, to look at
# - sim-web: the simulator built for browsers, checked against the above
# - blueprints: the Home Assistant blueprints for the button grid, run in
#   Home Assistant's test harness
# - features: that every theme, and every feature, builds (features.yml);
#   sim, sim-web and firmware wait for it
# - firmware: builds and packages both variants exactly as a release would
#   (scripts/release.sh), and uploads them, so every PR, and every commit on
#   main, has a package to try on a watch; checks them, and the `compare`
#   build, against every size constraint (scripts/size.py); and on a PR,
#   reports how their sizes changed, which size-report.yml then posts
#
# The firmware itself has no tests that run in CI: it needs the watch. See
# check.yml for the toolchains, concurrency cancellation and triggers.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: test
jobs:
  host-tests:
    runs-on: ubuntu-latest
    name: ${{ matrix.toolchain }} / ${{ matrix.crate }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [pinned, beta]
        crate: [alarm, aranet, arrival, backoff, battery, brightness, bthome, buttons, calendar, day, decimal, dfu, font, gb, gb_buckets, gesture, glance, heart_schedule, link, live, mcuboot, minute_ring, nav, on_time, packet_pool, ppg, qr, route, rtt_ring, sleep, step_counter, snapshot, temperature, theme, wake]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install beta
        if: matrix.toolchain == 'beta'
        run: rustup toolchain install beta --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          workspaces: host-tests/${{ matrix.crate }}
          key: ${{ matrix.toolchain }}
      # Each crate has its own .cargo/config.toml pointing it at the host,
      # which cargo only finds when run from the crate's directory.
      # --release: the PPG simulations are slow unoptimised.
      - name: cargo test
        working-directory: host-tests/${{ matrix.crate }}
        run: cargo ${{ matrix.toolchain == 'beta' && '+beta' || '' }} test --locked --release
  # The Gadgetbridge mock's own tests (its JSON, escaping and upsert
  # against Gadgetbridge's behaviour). It's shared by `host-tests/gb` and
  # `sim`, so it lives at the top, not in `host-tests/` with the matrix.
  gbmock:
    runs-on: ubuntu-latest
    name: gbmock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          workspaces: gbmock
      - name: cargo test
        working-directory: gbmock
        run: cargo test --locked --release
  features:
    uses: ./.github/workflows/features.yml
  sim:
    needs: features
    runs-on: ubuntu-latest
    name: sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      # The approved screenshots are in Git LFS. They come from a cache
      # keyed by their LFS ids where possible, rather than `lfs: true`,
      # since every download counts against the repository's LFS
      # bandwidth; `git lfs pull` then fetches only what the cache lacks.
      - name: list LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort >lfs-ids
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag=v6.1.0
        with:
          path: .git/lfs/objects
          # (`hashFiles` only reads the workspace, hence lfs-ids there.)
          key: lfs-${{ hashFiles('lfs-ids') }}
          restore-keys: lfs-
      - name: fetch LFS objects
        run: git lfs pull
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          workspaces: sim
      # Without the window, which a runner has nowhere to show. The tests
      # run the tour (which checks itself), the README's screenshots, and
      # Gadgetbridge's lines, and check every screenshot against the
      # approved ones (see sim/README.md).
      - name: cargo test
        working-directory: sim
        run: cargo test --locked --no-default-features
      # And all of them again with every theme built in: each theme's own
      # screenshots (src/themes/<name>/shots/), which the run above only
      # checked the default's of, and that nothing else assumes the
      # default is the only theme (THEME's next scheme, say).
      - name: cargo test, every theme
        working-directory: sim
        run: cargo test --locked --no-default-features --features themes-all
      # What the tests drew, to look at (what this commit's UI looks like,
      # without a watch), and, when they failed on a difference, the
      # images of it: under each script's name, `rendered/` and
      # `differences/`. Even when the tests fail, for those images. The
      # target directory is named after the host (sim/.cargo/config.toml).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: sim/target/*/tmp/shots/
          if-no-files-found: error
  # The simulator in a browser (sim/web/): that it builds for WebAssembly
  # (and lints clean there: much of it is compiled differently), that it
  # works driven as the page drives it, and that every screenshot it takes
  # is the same as the command line's, byte for byte (web/check.sh). The
  # built page is uploaded, to serve and try.
  sim-web:
    needs: features
    runs-on: ubuntu-latest
    name: sim / web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      # Not in rust-toolchain.toml's targets, which every firmware build
      # would then download.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          workspaces: sim
          key: web
      - name: cargo clippy
        working-directory: sim
        run: cargo clippy --locked --lib --no-default-features --features themes-all --target wasm32-unknown-unknown -- -D warnings
      # Node comes with the runner image.
      - name: web/check.sh
        working-directory: sim
        run: web/check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: sim-web
          path: sim/target/web/
          if-no-files-found: error
  # The Home Assistant blueprints (blueprints/), set up as automations in
  # Home Assistant's own test harness, with the watch's events fired at
  # them (blueprints/test/).
  blueprints:
    runs-on: ubuntu-latest
    name: blueprints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      # pipx comes with the runner image; uv fetches the Python the pinned
      # Home Assistant needs, newer than the image's.
      - name: Install Home Assistant's test harness
        run: |
          pipx install uv
          uv venv -p 3.14 tmp/venv-blueprints
          VIRTUAL_ENV=tmp/venv-blueprints uv pip install -r blueprints/test/requirements.txt
      - name: pytest
        run: tmp/venv-blueprints/bin/python -I -m pytest blueprints/test
  firmware:
    needs: features
    runs-on: ubuntu-latest
    name: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          # A PR's own head commit, not the merge commit GitHub builds by
          # default: the version names the commit, and only the PR's own
          # exists for anyone to look up.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # All of history, to count commits for snapshot versions.
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
      # Cargo.toml's version, plus `-pr.<number>` for a PR, or
      # `-snap.<commits on main>` for main, plus `+<commit>` (see
      # scripts/release.sh). The commit count only grows along main, so
      # snapshots sort in order.
      - name: version
        id: version
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n $PR ]]; then
            echo "pre=pr.$PR" >>"$GITHUB_OUTPUT"
          else
            echo "pre=snap.$(git rev-list --count HEAD)" >>"$GITHUB_OUTPUT"
          fi
      - name: build and package
        id: build
        run: |
          scripts/release.sh --pre "${{ steps.version.outputs.pre }}" dist
          # `ur-<digit>…` is the plain variant; `ur-logging-…` the other.
          plain=(dist/ur-[0-9]*-dfu.zip)
          logging=(dist/ur-logging-*-dfu.zip)
          echo "ur=${plain[0]}" >>"$GITHUB_OUTPUT"
          echo "logging=${logging[0]}" >>"$GITHUB_OUTPUT"
      # Everything, as one (zipped) artifact: images, ELFs for decoding logs,
      # checksums.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: ur-${{ steps.version.outputs.pre }}
          path: dist/
          if-no-files-found: error
      # And the two packages people actually send to a watch, each on its
      # own and unzipped (`archive: false`, one file per artifact, named
      # after the file), so a phone can hand the download straight to the
      # nRF Device Firmware Update app rather than unpacking a zip in a zip.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          path: ${{ steps.build.outputs.ur }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          path: ${{ steps.build.outputs.logging }}
          archive: false
          if-no-files-found: error
      # Not released, but a dev kit runs it to check the simulator against
      # (`ur-sim --devkit`), so it must fit too, and it's the tightest on
      # RAM. In a target directory of its own: release.sh's path remapping
      # makes for different rustflags, and sharing one would rebuild every
      # dependency, twice, on every run.
      - name: build compare
        run: |
          CARGO_TARGET_DIR=target/compare cargo build --release --locked --features compare
          mkdir -p size
          cp target/compare/thumbv7em-none-eabihf/release/ur size/compare.elf
      # Every constraint on the image and on RAM, for every variant, and
      # that the layout agrees everywhere it's written down.
      - name: size
        run: |
          elfs=()
          for elf in dist/*.elf; do
            [[ $elf == *-slot.elf ]] || elfs+=("$elf")
          done
          python3 scripts/size.py check "${elfs[@]}" compare=size/compare.elf --json size/head.json

      # The size report, on PRs: the same builds of where the PR branched
      # off (the merge base, so that what has changed on the base branch
      # since doesn't show up as the PR's doing), measured by the PR's
      # size.py, and the difference as Markdown. This job can't comment
      # itself (a PR from a fork gets a read-only token, rightly, since this
      # runs the fork's code): it uploads the report, and size-report.yml,
      # which runs none of the PR's code, posts it. These steps run even if
      # the size check failed, as that's when the report matters most.
      - name: base
        id: base
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('size/head.json') != '' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "sha=$(git merge-base "$BASE_SHA" HEAD)" >>"$GITHUB_OUTPUT"
          echo "script=$(sha256sum scripts/size.py | cut -c1-16)" >>"$GITHUB_OUTPUT"
      # Every push to a PR has the same merge base until it's rebased, so
      # the base's sizes are cached. The key has size.py's hash too, since a
      # change to it may measure differently.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag=v6.1.0
        id: base-cache
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        with:
          path: size/base.json
          key: size-base-${{ steps.base.outputs.sha }}-${{ steps.base.outputs.script }}
      # In a worktree outside the checkout (one inside would see this
      # checkout's .cargo/config.toml too), sharing its target directory, so
      # only the firmware crate itself is rebuilt. With the same `--pre`, so
      # the version strings baked in are the same length. If the base
      # doesn't build, the report says so, rather than the job failing.
      - name: build base
        if: ${{ !cancelled() && steps.base.outcome == 'success' && steps.base-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          MERGE_BASE: ${{ steps.base.outputs.sha }}
          PRE: ${{ steps.version.outputs.pre }}
        run: |
          worktree=$RUNNER_TEMP/base
          git worktree add --detach "$worktree" "$MERGE_BASE"
          ln -s "$PWD/target" "$worktree/target"
          (cd "$worktree" && rustup toolchain install)
          "$worktree/scripts/release.sh" --pre "$PRE" "$worktree/dist"
          (cd "$worktree" && CARGO_TARGET_DIR=target/compare cargo build --release --locked --features compare)
          cp target/compare/thumbv7em-none-eabihf/release/ur "$worktree/compare.elf"
          elfs=()
          for elf in "$worktree"/dist/*.elf; do
            [[ $elf == *-slot.elf ]] || elfs+=("$elf")
          done
          python3 scripts/size.py measure "${elfs[@]}" compare="$worktree/compare.elf" --json size/base.json
      - name: size report
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        env:
          PR: ${{ github.event.pull_request.number }}
          MERGE_BASE: ${{ steps.base.outputs.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=size/base.json
          base_label="\`${MERGE_BASE:0:7}\`, where it branched off \`$BASE_REF\`"
          # Not into base.json, which would be cached.
          if [[ ! -s $base ]]; then
            base=size/none.json
            echo '{}' >"$base"
            base_label="nothing: \`${MERGE_BASE:0:7}\` (on \`$BASE_REF\`) didn't build"
          fi
          python3 scripts/size.py diff "$base" size/head.json \
            --head-label "\`${HEAD_SHA:0:7}\`" --base-label "$base_label" >size/report.md
          echo "$PR" >size/pr
          cat size/report.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        with:
          name: size-report
          path: |
            size/report.md
            size/pr
          if-no-files-found: error
