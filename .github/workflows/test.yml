# The main CI workflow, on all pushes to main and all PRs:
# - host-tests: the firmware's hardware-free modules (signal processing,
#   sleep, alarms, glance detection), each built into a host crate under
#   host-tests/ and tested on the computer, on stable and beta
# - firmware: builds and packages both variants exactly as a release would
#   (scripts/release.sh), and uploads them, so every PR has a package to try
#   on a watch
#
# The firmware itself has no tests that run in CI: it needs the watch. See
# check.yml for how the concurrency cancellation and triggers work.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: test
jobs:
  host-tests:
    runs-on: ubuntu-latest
    name: ${{ matrix.toolchain }} / ${{ matrix.crate }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
        crate: [alarm, glance, ppg, sleep]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          workspaces: host-tests/${{ matrix.crate }}
      # Each crate has its own .cargo/config.toml pointing it at the host,
      # which cargo only finds when run from the crate's directory.
      # --release: the PPG simulations are slow unoptimised.
      - name: cargo test
        working-directory: host-tests/${{ matrix.crate }}
        run: cargo test --locked --release
  firmware:
    runs-on: ubuntu-latest
    name: stable / firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
      # A version no release will have (0.0.x), unique per run, so a
      # watch's boot log says which CI run it's running.
      - name: build and package
        run: scripts/release.sh "0.0.$(( ${{ github.run_number }} % 65536 ))" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: firmware-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
