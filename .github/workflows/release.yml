# Publishes a release when a version tag is pushed. Cargo.toml's version is
# the source of truth, and the tag must match it (see CONTRIBUTING.md):
#
#     git tag v0.9.0
#     git push origin v0.9.0
#
# Shaped after what cargo-dist generates (plan, build, host), for firmware
# instead of host binaries:
#
# - plan: checks the tag against Cargo.toml's version, and fails the
#   release if they differ. A version with a prerelease part (0.9.0-rc.1)
#   makes a GitHub prerelease.
# - build: scripts/release.sh builds and packages both variants (and a
#   package for each other theme), as
#   `<version>+<commit>`, scripts/size.py checks they fit, then GitHub
#   attests their build provenance (actions/attest): a signed statement
#   that this workflow, at this commit, produced exactly these files.
#   Anyone can check a download with
#
#       gh attestation verify ur-0.9.0-dfu.zip --repo jonhoo/ur
#
#   The build deliberately uses no cache, so nothing from an earlier run
#   (which a PR could have influenced) goes into an attested release. It's
#   also reproducible: the same commit rebuilt anywhere gives the same
#   files (see scripts/release.sh).
# - host: creates the GitHub release, with every file and the checksums.
#
# Unlike cargo-dist, there's no installer and no per-platform matrix: the
# PineTime is the one platform, and the release *is* the package people
# send to their watch.
permissions:
  contents: read
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
name: release
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - id: plan
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ $TAG != "v$version" ]]; then
            echo "::error::tag $TAG doesn't match Cargo.toml's version ($version); the tag should be v$version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$([[ $version == *-* ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For actions/attest: the OIDC token that gets a Sigstore signing
      # certificate, storing the attestation, and recording the artifact.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: build and package
        run: UR_THEME_LIST=themes.tsv scripts/release.sh dist
      # test.yml's size check, on exactly what's released: a package that
      # doesn't fit the watch must not ship.
      - name: size
        run: |
          elfs=()
          for elf in dist/*.elf; do
            [[ $elf == *-slot.elf ]] || elfs+=("$elf")
          done
          python3 scripts/size.py check "${elfs[@]}"
      - name: attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # tag=v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
      # Which packages are of which theme, for the notes: not a file of
      # the release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: themes
          path: themes.tsv
          if-no-files-found: error
  host:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      # To create the release.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # tag=v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # tag=v8.0.2
        with:
          name: themes
          path: themes
      - name: release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # The tag's message names what's new (see CONTRIBUTING), so it
          # leads the notes; its first line is already the release's title.
          # It comes from the API rather than a checkout, since the release
          # doesn't otherwise need the source.
          tag_object=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)
          gh api "repos/$REPO/git/tags/$tag_object" --jq .message | tail -n +3 >notes.md
          # GitHub shows every newline in release notes as a line break, so
          # each paragraph below is one line.
          cat >>notes.md <<EOF

          ## Installing

          Send \`ur-$VERSION-dfu.zip\` to the watch over Bluetooth, from a phone with Nordic's [nRF Device Firmware Update](https://play.google.com/store/apps/details?id=no.nordicsemi.android.dfu) app or from a computer with \`scripts/dfu.py\`. It installs over InfiniTime and updates ur alike; see the README's [Installing](https://github.com/$REPO#installing) section.

          \`ur-logging-$VERSION-dfu.zip\` is the same firmware keeping a log in the watch's flash, which \`scripts/fetch-log.py\` fetches over Bluetooth, for reporting problems. It writes to flash constantly and costs a little battery.
          EOF
          # A package of each other theme, if there are any: `ur` with
          # that theme in place of the default (see scripts/release.sh).
          # (themes.tsv: release.sh's list of them, a theme a line, its
          # directory's name, its name as people read it, then the sides
          # it has colour schemes for: both, night or day.) One with
          # schemes of one side shows them by day and by night alike,
          # which the notes say.
          themes=()
          while IFS=$'\t' read -r name display sides; do
            entry="\`ur-$name-$VERSION-dfu.zip\` ([$display](https://github.com/$REPO/tree/$TAG/src/themes/$name))"
            if [[ $sides != both ]]; then
              entry+=", with $sides colour schemes only, which it shows by day and by night alike (FORCE can't change; see the README's [FAQ D02](https://github.com/$REPO#d02-the-watch-says-no-day-themes-or-no-night-themes))"
            fi
            themes+=("$entry")
          done <themes/themes.tsv
          if ((${#themes[@]} > 0)); then
            list=$(printf '%s; ' "${themes[@]}")
            echo >>notes.md
            echo "Other looks: ${list%; }. Each is \`ur\` with only that theme in place of the default, Retro." >>notes.md
          fi
          cat >>notes.md <<EOF

          ## Files

          For each of \`ur\` and \`ur-logging\`:

          - \`-dfu.zip\`: the Bluetooth update package.
          - \`.img\`: the raw MCUBoot image.
          - \`-slot.elf\`: the image as an ELF, for flashing a dev kit over SWD.
          - \`.elf\`: the firmware with symbols, which decodes the watch's logs (\`defmt-print -e\`).

          Another theme's package is its \`-dfu.zip\` alone. \`sha256.sum\` has their checksums.

          ## Verifying

          Every file has a build provenance attestation from GitHub Actions. To check that a download was built by this repository's release workflow, unmodified:

              gh attestation verify ur-$VERSION-dfu.zip --repo $REPO

          The build is also reproducible: the same files, byte for byte, come out of building the tag again, which this checks against this release's checksums:

              git checkout $TAG
              scripts/release.sh
              gh release download $TAG --repo $REPO --pattern sha256.sum --dir published
              (cd dist && sha256sum -c ../published/sha256.sum)
          EOF
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [[ $PRERELEASE == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ur $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"
