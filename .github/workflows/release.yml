# Publishes a release when a version tag is pushed:
#
#     git tag v0.9.0
#     git push origin v0.9.0
#
# Shaped after what cargo-dist generates (plan, build, host), for firmware
# instead of host binaries:
#
# - plan: the version comes from the tag (vMAJOR.MINOR.REVISION, with an
#   optional -suffix for a prerelease), and goes into the image header that
#   the watch logs at boot and the bootloader compares. The tag is the
#   source of truth; Cargo.toml's version isn't used for anything.
# - build: scripts/release.sh builds and packages both variants, then
#   GitHub attests their build provenance (actions/attest): a signed
#   statement that this workflow, at this commit, produced exactly these
#   files. Anyone can check a download with
#
#       gh attestation verify ur-0.9.0-dfu.zip --repo OWNER/REPO
#
#   The build deliberately uses no cache, so nothing from an earlier run
#   (which a PR could have influenced) goes into an attested release.
# - host: creates the GitHub release, with every file and the checksums.
#
# Unlike cargo-dist, there's no installer and no per-platform matrix: the
# PineTime is the one platform, and the release *is* the package people
# send to their watch.
permissions:
  contents: read
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
name: release
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - id: plan
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # v1.2.3 → 1.2.3; v1.2.3-rc.1 → 1.2.3, as a prerelease. The image
          # header only holds numbers, so a prerelease carries the version it
          # leads up to.
          if [[ ! $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-.+)?$ ]]; then
            echo "::error::tag $TAG isn't vMAJOR.MINOR.REVISION[-suffix]"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >>"$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n ${BASH_REMATCH[2]} ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For actions/attest: the OIDC token that gets a Sigstore signing
      # certificate, storing the attestation, and recording the artifact.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - name: build and package
        run: scripts/release.sh "${{ needs.plan.outputs.version }}" dist
      - name: attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # tag=v4.2.2
        with:
          subject-path: dist/ur-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
  host:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      # To create the release.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # tag=v8.0.2
        with:
          name: release
          path: dist
      - name: release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cat >notes.md <<EOF
          ## Installing

          Send \`ur-$VERSION-dfu.zip\` to the watch over Bluetooth, from a phone
          with Nordic's nRF Device Firmware Update app or from a computer with
          \`scripts/dfu.py\`. It installs over InfiniTime and updates ur alike;
          see the README's Installing section.

          \`ur-field-$VERSION-dfu.zip\` is the same firmware keeping a log in
          the watch's flash, which \`scripts/fetch-log.py\` fetches over
          Bluetooth, for reporting problems. It writes to flash constantly and
          costs a little battery.

          ## Files

          For each of \`ur\` and \`ur-field\`:

          - \`-dfu.zip\`: the Bluetooth update package.
          - \`.img\`: the raw MCUBoot image.
          - \`-slot.elf\`: the image as an ELF, for flashing a dev kit over SWD.
          - \`.elf\`: the firmware with symbols, which decodes the watch's logs
            (\`defmt-print -e\`).

          \`sha256.sum\` has their checksums.

          ## Verifying

          Every file has a build provenance attestation from GitHub Actions. To
          check that a download was built by this repository's release
          workflow, unmodified:

              gh attestation verify ur-$VERSION-dfu.zip --repo $REPO
          EOF
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [[ $PRERELEASE == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ur $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"
