# Runs the Kani proofs (`#[kani::proof]`, with CBMC) that a change could
# affect, on every pull request and every push to main: the proofs of the
# host-test crates whose own files changed, or that include a firmware
# module that did (scripts/kani-affected.sh has the rule). So a proof a
# change breaks fails that change, while it's being looked at, where
# running every proof on release tags (verify.yml, until November 2026)
# found it weeks later, in a job of two hours that nobody was watching.
#
# - plan: names the affected crates and deals them into shards. Seconds;
#   and when nothing with proofs is affected (most changes: the UI, the
#   drivers, the docs), it's all that runs
# - proofs: a job per shard, each meant to end within half an hour and
#   stopped at an hour. No job here may run for hours, whatever changed
#
# Every proof of every crate still runs before a release, on the
# maintainer's computer: scripts/release-gate.sh (see CONTRIBUTING.md's
# "Local release gate"). And on demand here (Actions → kani → Run
# workflow), as a change to this file or to the script does too.
#
# A workflow of its own rather than jobs in test.yml, though test.yml's
# `kani` job (that every proof compiles) stays there: "everything, when
# the workflow changes" is then a change to how the proofs run (Kani's
# version, its flags, the shards), not any edit to the main workflow.
# The two share Kani's cache entry (its key and paths must match
# test.yml's exactly).
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  # As test.yml's. TODO: Dependabot doesn't update this pin; move both
  # when Kani breaks, or a new Rust edition needs it.
  KANI_VERSION: 0.68.0
name: kani
jobs:
  plan:
    runs-on: ubuntu-latest
    name: plan
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      # A pull request's checkout is its merge into the base, whose first
      # parent is the base: two commits deep, to diff against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          fetch-depth: 2
      # The crates to prove, a line each, into $RUNNER_TEMP/affected.
      # - A pull request: what it changes from its base.
      # - A push to main: what it changes from where main was (`before`),
      #   which is fetched, as the push may be of several commits. If it
      #   can't be (a force push dropped it), everything.
      # - On demand: everything.
      - name: the affected crates
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail
          case $EVENT in
            pull_request)
              scripts/kani-affected.sh HEAD^1 HEAD >"$RUNNER_TEMP/affected"
              ;;
            push)
              if git fetch --no-tags --depth=1 origin "$BEFORE"; then
                scripts/kani-affected.sh "$BEFORE" HEAD >"$RUNNER_TEMP/affected"
              else
                echo "::warning::couldn't fetch $BEFORE, where main was: running every crate's proofs"
                scripts/kani-affected.sh --all >"$RUNNER_TEMP/affected"
              fi
              ;;
            *)
              scripts/kani-affected.sh --all >"$RUNNER_TEMP/affected"
              ;;
          esac
          {
            echo "Crates whose proofs this change affects: $(wc -l <"$RUNNER_TEMP/affected") of $(scripts/kani-affected.sh --all | wc -l)"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/affected"
          } >>"$GITHUB_STEP_SUMMARY"
      # The shards, by weight. A line of `KANI_SHARDS` is a shard's name,
      # then what it runs: `CRATE` (of host-tests/), or
      # `CRATE:HARNESS,HARNESS` for only those of its harnesses, by their
      # full names. A crate named both ways is split: where it's named
      # alone, it runs every harness but the ones named elsewhere (so a
      # new one runs there). A crate with proofs that isn't named alone
      # goes to the shard `rest` (with the harnesses not named, if some
      # are), so a new crate is never left out; and one named here that
      # has no proofs any more is a warning. Of all that, a shard gets
      # only its affected crates, and a shard with none isn't run.
      #
      # The weights are each crate's minutes on a runner, in v0.12.0's
      # run of every proof (one job then, 2h06; from its log), and, in
      # brackets, on a desktop since (November 2026, 80 minutes in all).
      # A runner took 1.3 to 2.6 times as long as the desktop, by the
      # harness:
      # - alarm: 41 then. Its proofs have changed since, to 20 on the
      #   desktop as they were before, so some 40 still: in two, the
      #   contracts' proofs (10 on the desktop, 7.5 of them
      #   `next_at`'s) and the proofs that use them (10)
      # - heart_schedule: 27 (18)
      # - gb_buckets: 18 (14), of which one harness is 12 (10)
      # - day, calendar, temperature and brightness: 5 to 6 each (3 to
      #   4), 21 together
      # - the rest: under 4 each, 18 together, building included
      # TODO: none of these shards has run on a runner as split here.
      # When one nears 30 minutes (each job's summary has its harnesses'
      # times), split it: name `rest`'s slowest crates in a shard of
      # their own, or a crate's slowest harnesses.
      - name: the shards
        id: shards
        env:
          KANI_SHARDS: |
            alarm-contracts alarm:proofs::next_at_keeps_its_contract,proofs::next_smart_keeps_its_contract
            alarm           alarm
            heart_schedule  heart_schedule
            gb_buckets      gb_buckets
            dates           day calendar temperature brightness
        run: |
          set -o pipefail
          mapfile -t all < <(scripts/kani-affected.sh --all)
          mapfile -t crates <"$RUNNER_TEMP/affected"
          # What the table says: each shard's items in turn, the
          # harnesses it names of each crate, and the crates it places
          # whole.
          declare -A named whole
          rows=()
          while read -ra line; do
            for item in "${line[@]:1}"; do
              crate=${item%%:*}
              if [[ " ${all[*]} " != *" $crate "* ]]; then
                echo "::warning::KANI_SHARDS names $crate, which has no proofs (any more?)"
              elif [[ " ${crates[*]} " != *" $crate "* ]]; then
                : # Not affected.
              elif [[ $item == *:* ]]; then
                named[$crate]+=${named[$crate]:+,}${item#*:}
                rows+=("${line[0]} $item")
              else
                whole[$crate]=1
                rows+=("${line[0]} $crate")
              fi
            done
          done <<<"$KANI_SHARDS"
          # Every other crate, and the other harnesses of a crate the
          # table only names some of, are the rest's.
          for crate in "${crates[@]}"; do
            [ -n "${whole[$crate]-}" ] || rows+=("rest $crate")
          done
          # `CRATE:!HARNESS,HARNESS` is how the job below is told "every
          # harness but these".
          for row in "${rows[@]}"; do
            read -r shard item <<<"$row"
            if [[ $item != *:* && -n ${named[$item]-} ]]; then
              item+=":!${named[$item]}"
            fi
            printf '%s\t%s\n' "$shard" "$item"
          done >"$RUNNER_TEMP/kani-shards"
          # (jq keeps an object's keys in the order they were added, so
          # the shards stay in the table's. With nothing affected, `[]`.)
          matrix=$(jq -Rnc '
            reduce (inputs | split("\t")) as [$shard, $item] ({}; .[$shard] += [$item])
            | to_entries | map({shard: .key, work: (.value | join(" "))})
          ' "$RUNNER_TEMP/kani-shards")
          jq . <<<"$matrix"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
  proofs:
    needs: plan
    # (A matrix can't be empty, so with nothing affected the job is
    # skipped, which a pull request's checks count as passing.)
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    name: proofs (${{ matrix.shard }})
    # A shard is meant to take half an hour at most (see `KANI_SHARDS`
    # above): the rest is room for a slow runner and for proofs that
    # grow, without letting one that blew up (an unwind bound too high)
    # run on. The step below stops itself before this does, to keep its
    # summary.
    timeout-minutes: 60
    strategy:
      # Every shard runs, whatever another finds.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Kani brings its own compiler and CBMC (`cargo kani setup`, into
      # ~/.kani), kept between runs by version. A new version takes ~5
      # minutes, once, to build and set up.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag=v6.1.0
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
          key: kani-${{ env.KANI_VERSION }}
      - name: Install Kani
        run: |
          command -v cargo-kani >/dev/null || cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      # A crate at a time, each crate's proofs one after another: CBMC's
      # memory grows fast with a proof's bounds, and one at a time keeps
      # the largest (4 GB) within a runner's.
      #
      # `matrix.work` is this shard's crates (see `plan`): `CRATE` for
      # all its proofs, `CRATE:HARNESS,...` for those, or
      # `CRATE:!HARNESS,...` for all but those, which takes the crate's
      # list of them (`cargo kani list`, which writes kani-list.json
      # beside the crate's Cargo.toml). A harness named that isn't there
      # fails the crate, by Kani's own doing, as a crate whose harnesses
      # couldn't be listed does here.
      #
      # Each harness gets 30 minutes (`--harness-timeout`, unstable in
      # Kani 0.68): the slowest took 22 on a runner (alarm's, in
      # v0.12.0's run; 8 on a desktop), and the slowest now should take
      # 12 to 20. A harness that blew up fails alone, named, and the
      # rest of its crate still runs, if there's time: the step has 50
      # minutes, of which each crate gets what is left (`timeout`), so
      # that the step ends with its summary before the job's 60 end it
      # without.
      #
      # The job's summary is a table of every harness, slowest first:
      # its result, its covers and its time, from `--output-format
      # terse`. A cover that isn't satisfied fails the crate too: Kani
      # itself reports the harness as verified, but its cover is there
      # to show the proof isn't vacuous (its `kani::assume`s leave some
      # input that reaches the case it's about), and an unsatisfied one
      # says it is.
      #
      # A step's shell is `bash -e`, without `pipefail` (that comes only
      # with an explicit `shell: bash`): without it here, the `tee`'s
      # success would hide a crate's failed proofs.
      - name: cargo kani, this shard's proofs
        env:
          WORK: ${{ matrix.work }}
        run: |
          set -o pipefail
          failed=()
          read -ra items <<<"$WORK"
          mkdir -p "$RUNNER_TEMP/kani"
          deadline=$((SECONDS + 50 * 60))
          for i in "${!items[@]}"; do
            item=${items[i]}
            crate=${item%%:*}
            echo "::group::$item"
            # `only`: the harnesses to run, if not all of them.
            only=()
            case $item in
              *:!*)
                # `list` doesn't read the crate's own
                # `[package.metadata.kani.unstable]`, as `cargo kani`
                # does, so it's told what alarm's proofs need.
                list=host-tests/$crate/kani-list.json
                (cd "host-tests/$crate" && cargo kani list -Z function-contracts -Z stubbing --format json) || true
                mapfile -t harnesses < <(jq -r '."standard-harnesses"[][], ."contract-harnesses"[][]' "$list" || true)
                rm -f "$list"
                if [ "${#harnesses[@]}" -eq 0 ]; then
                  failed+=("$crate (its harnesses couldn't be listed)")
                  echo "::endgroup::"
                  continue
                fi
                for harness in "${harnesses[@]}"; do
                  [[ ",${item#*:!}," == *",$harness,"* ]] || only+=(--harness "$harness")
                done
                if [ "${#only[@]}" -eq 0 ]; then
                  echo "Every harness of $crate is in another shard."
                  echo "::endgroup::"
                  continue
                fi
                ;;
              *:*)
                IFS=, read -ra harnesses <<<"${item#*:}"
                for harness in "${harnesses[@]}"; do
                  only+=(--harness "$harness")
                done
                ;;
            esac
            if [ "${#only[@]}" -gt 0 ]; then
              only=(--exact "${only[@]}")
            fi
            left=$((deadline - SECONDS))
            if [ "$left" -le 0 ]; then
              failed+=("$item (not run: the step's 50 minutes were up)")
              echo "::endgroup::"
              continue
            fi
            log=$RUNNER_TEMP/kani/$i-$crate.txt
            (cd "host-tests/$crate" && timeout "$left" cargo kani --output-format terse -Z unstable-options --harness-timeout 30m "${only[@]}") 2>&1 \
              | tee "$log" || failed+=("$item")
            echo "::endgroup::"
            # A row per harness: `Checking harness NAME...`, then its
            # covers (`** 2 of 2 cover properties satisfied`), its result
            # (`VERIFICATION:- SUCCESSFUL`) and its time (`Verification
            # Time: 1.5s`). A harness that timed out gets `CBMC timed
            # out.` instead of a time, so a row is also finished by the
            # next harness or the end of the log.
            awk -v crate="$crate" '
              function row() {
                if (harness != "") printf "| %s | %s | %s | %s | %s |\n", crate, harness, result, covers, time
                harness = ""
              }
              /^Checking harness / { row(); harness = $3; sub(/\.\.\.$/, "", harness); result = "?"; covers = "-"; time = "-" }
              /cover properties satisfied/ { covers = $2 " of " $4; if ($2 != $4) print "unsatisfied" > "/dev/stderr" }
              /^VERIFICATION:- / { result = $2 }
              /^CBMC timed out/ { time = "timed out" }
              /^Verification Time: / { time = sprintf("%.1f", $3); row() }
              END { row() }
            ' "$log" >"$log.rows" 2>"$log.covers"
            if [ -s "$log.covers" ]; then
              failed+=("$item (a cover unsatisfied)")
            fi
          done
          {
            echo "| crate | harness | result | covers | seconds |"
            echo "|---|---|---|---|--:|"
            # (`find`, as a crate that wasn't run leaves no rows, and
            # there may be none at all.)
            find "$RUNNER_TEMP/kani" -name '*.rows' -exec cat {} + >"$RUNNER_TEMP/kani-rows"
            grep 'timed out' "$RUNNER_TEMP/kani-rows" || true
            { grep -v 'timed out' "$RUNNER_TEMP/kani-rows" || true; } | sort -t'|' -k6 -rg
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::Kani failed in: %s\n' "${failed[@]}"
            exit 1
          fi
