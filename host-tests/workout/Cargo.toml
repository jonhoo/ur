[package]
name = "workout-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/workout.rs` (included via `#[path]`), and a
# replay of a field log's minutes through it. Not part of the firmware
# workspace: run `cargo test` from this directory.
[workspace]

[dependencies]

# `cargo kani` builds with `--cfg kani`, for the proofs in `src/main.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# CI runs the host tests with `--release`; keep the arithmetic checks, so
# that an overflow fails a test here.
[profile.release]
overflow-checks = true
debug-assertions = true
