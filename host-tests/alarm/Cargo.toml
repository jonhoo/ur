[package]
name = "alarm-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/alarm.rs` (included via `#[path]`). Not part of
# the firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]

[lints.rust]
# `cargo kani` sets `cfg(kani)` for the proofs at the end of src/main.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
bolero = "0.13.7"

# CI runs the host tests with `--release`; keep the arithmetic checks and
# the module's own `debug_assert!`s (`State::due`'s "strictly after"
# above all), so that the clock model in `src/clock_model.rs` trips them.
[profile.release]
overflow-checks = true
debug-assertions = true

# What `cargo bolero test` builds with (see `src/clock_model.rs`): fast,
# but with the checks, as above.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
overflow-checks = true
debug-assertions = true

# The proofs of `State` take `next_at` and `next_smart`'s contracts in their
# place (`stub_verified`, which needs `stubbing` too; see `proofs` in
# `src/main.rs`).
[package.metadata.kani.unstable]
function-contracts = true
stubbing = true
