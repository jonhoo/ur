[package]
name = "log_pack-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/log_pack.rs` (included via `#[path]`). Not
# part of the firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]

# `cargo kani` builds with `--cfg kani`, for the proofs in `src/main.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# CI runs the host tests with `--release`; keep the arithmetic checks.
[profile.release]
overflow-checks = true
