[package]
name = "living-tokyo-theme-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for Living Tokyo's colour schemes (`src/palette.rs` and
# `src/themes/living_tokyo/schemes/`, included via `#[path]`): that colours with
# different meanings stay apart in every scheme. Not part of the
# firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]
# `Color` derives `defmt::Format` for the watch's logs.
defmt = "1.2.0"

# `cargo kani` builds with `--cfg kani`, for the proofs in `src/main.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
