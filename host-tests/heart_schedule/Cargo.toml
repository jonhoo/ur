[package]
name = "heart-schedule-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/heart_schedule.rs` (included via `#[path]`). Not
# part of the firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]

# `cargo kani` builds with `--cfg kani`, for the proofs in `src/main.rs`.
[lints.rust]
# The firmware's `field-log` feature too, which only gates what the plain
# build leaves out: the host tests run it all.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(feature, values("field-log"))'] }

# CI runs the host tests with `--release`; keep the arithmetic checks and
# the module's own `debug_assert!`s, so that a broken invariant fails a
# test here, not only under `cargo test`.
[profile.release]
overflow-checks = true
debug-assertions = true
