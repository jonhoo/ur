[package]
name = "spill-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/spill.rs` (included via `#[path]`). Not part of
# the firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]

# CI runs the host tests with `--release`; keep the arithmetic checks.
[profile.release]
overflow-checks = true

[dev-dependencies]
quickcheck = "1.1.0"
