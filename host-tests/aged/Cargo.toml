[package]
name = "aged-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/aged.rs` (included via `#[path]`). Not part of
# the firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]

# CI runs the host tests with `--release`; keep the arithmetic checks and
# the modules' own `debug_assert!`s, so that a broken invariant fails a
# test here, not only under `cargo test`.
[profile.release]
overflow-checks = true
debug-assertions = true
