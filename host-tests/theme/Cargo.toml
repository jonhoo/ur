[package]
name = "theme-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/theme.rs` (included via `#[path]`): that colours
# with different meanings stay apart in every theme. Not part of the
# firmware workspace: run `cargo test` from this directory.
[workspace]

# The firmware's `theme-tokyo-night`, whose themes replace the usual ones:
# `cargo test --features theme-tokyo-night` checks them instead.
[features]
theme-tokyo-night = []

[dependencies]
# `Color` derives `defmt::Format` for the watch's logs.
defmt = "1.2.0"

# `cargo kani` builds with `--cfg kani`, for the proofs in `src/main.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
