[package]
name = "ur"
version = "0.11.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonhoo/ur"
# Firmware, not a library: nothing to publish to crates.io.
publish = false

[dependencies]
aes = "0.8.4"
bt-hci = { version = "0.10.1", default-features = false }
cortex-m = { version = "0.7.10", features = ["inline-asm"] }
cortex-m-rt = { version = "0.7.7", features = ["paint-stack"] }
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52832", "time-driver-rtc1", "gpiote", "defmt", "rt", "nfc-pins-as-gpio", "unstable-pac"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-time-driver = "0.2.2"
embedded-hal-async = "1"
embedded-storage-async = "0.4.1"
heapless = "0.9.3"
libm = "0.2.16"
nrf-mpsl = { version = "0.4.0", features = ["nrf52832", "defmt", "critical-section-impl"] }
nrf-sdc = { version = "0.4.0", features = ["nrf52832", "peripheral", "central", "defmt"] }
sequential-storage = { version = "8.0.2", features = ["defmt"] }
static_cell = "2.1.1"
trouble-host = { version = "0.8.0", default-features = false, features = ["peripheral", "scan", "gatt", "derive", "default-packet-pool-mtu-251", "defmt", "security"] }

[[bin]]
name = "ur"
# There is no test harness for this target.
test = false
bench = false

[profile.release]
# Symbols cost nothing on-device, but make defmt locations and gdb useful.
debug = 2
lto = "fat"
codegen-units = 1
# Flash, not speed, is what runs out: "z" is ~31 KB (7%) smaller than "s".
# Measured on the dev kit, a heart rate window takes as long either way
# (~4 ms), and a display flush is SPI-bound once `Canvas::changed_span`
# skips unchanged rows; the deepest stack grew by ~0.3 KB, to 8.9 KB of 11.
# With fat LTO, the root crate's level applies to everything, so
# per-package overrides (say, "s" for hot code) would change nothing.
opt-level = "z"

[profile.dev]
# Unoptimized embassy code is both large and slow enough to miss SPI timing.
opt-level = 1

[features]
default = ["theme-retro"]

# Themes (see src/themes/): how every screen looks, each with its colour
# schemes. A build has only the themes it names, to keep its image small,
# and Settings' THEME row steps through their schemes; it needs one at
# least (`--no-default-features` alone doesn't build). A theme is
# `theme-<its directory's name>`, and in `themes-all` too.
#
# Retro, the watch's own look, after old handhelds and arcade cabinets.
theme-retro = []
# Every theme in the repository: the web simulator's, and CI's check that
# every theme builds.
theme-living_tokyo = []
themes-all = ["theme-retro", "theme-living_tokyo"]

# Keep the defmt log in the SPI flash, for watches without a debug probe; see
# `src/field_log.rs`. Not for builds read through a probe.
field-log = []
# Take taps, buttons, test notifications, battery readings and the like
# written into RAM over the debug probe (`scripts/screenshot.py --input`,
# `ur-sim --devkit`); see `src/debug.rs`. Only for dev kits: a sealed watch
# has no probe to write them, so releases leave it out (scripts/release.sh
# checks), and it's off by default so that they can't take it in by
# accident. Screenshots work without it.
debug-input = []
# Export what the UI loop does and renders with, for checking the simulator
# against a dev kit (`ur-sim --devkit`, which drives it with `debug-input`);
# see `src/compare.rs`. Costs ~2.3 KB of RAM, so not for releases.
compare = ["debug-input"]
# Edge coverage for the dev kit fuzzer, on top of `compare`: only meaningful
# in a build by `sim/coverage-build.sh`, which instruments this crate's own
# code. Costs a byte of RAM per branch, so never for releases. See
# `src/coverage.rs`.
coverage = ["compare"]
# Save to flash back to back, for `scripts/flash-stress.py` to check that
# erases and writes never overrun their radio timeslots; see
# `src/flash_stress.rs`. Only for dev kits.
flash-stress = []
# Wedge the sensor bus for the first 5 s after boot, so that touch, the
# accelerometer and the heart-rate sensor all have to recover from it; see
# `wedge_task` in `src/i2c.rs`. Only for dev kits: it implies `debug-input`
# so that scripts/release.sh refuses it.
wedge-i2c = ["debug-input"]
